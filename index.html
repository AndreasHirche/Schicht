<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Schichtplan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e8f0;--muted:#64748b;
  --si:#3b82f6;--ma:#f97316;--sa:#22c55e;
  --radius:10px;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}

/* ── APP SHELL ── */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px 8px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:8px}
.topbar-nav{display:flex;align-items:center;gap:8px}
.nav-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);font-size:.82rem;font-weight:600;
  cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn:active{background:rgba(255,255,255,0.12)}
.month-title{font-size:1rem;font-weight:700;color:var(--text);white-space:nowrap;min-width:120px;text-align:center}
.topbar-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:active{background:rgba(255,255,255,0.12)}

/* ── CALENDAR ── */
.cal-wrap{flex:1;overflow-y:auto;padding:8px 6px 12px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-header span{text-align:center;font-size:.62rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;padding:2px 0}
.cal-header span.sun{color:#ef4444}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day-cell{background:var(--surface);border-radius:6px;padding:3px;
  border:1px solid var(--border);cursor:pointer;transition:border-color .15s;
  min-height:64px;position:relative}
.day-cell:active{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.06)}
.day-cell.today .day-num{background:var(--si);color:#fff;border-radius:50%;width:18px;height:18px;
  display:flex;align-items:center;justify-content:center}
.day-cell.empty{background:transparent;border-color:transparent;cursor:default}
.day-cell.sun .day-num{color:#ef4444}
.day-cell.sat .day-num{color:#94a3b8}
.day-num{font-size:.72rem;font-weight:700;color:var(--text);margin-bottom:2px;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center}
/* shift rows inside day cell */
.shift-rows{display:flex;flex-direction:column;gap:1px}
.shift-row{display:flex;align-items:center;gap:1px;min-height:9px}
.shift-lbl{font-size:.5rem;color:var(--muted);width:14px;flex-shrink:0;line-height:1;overflow:hidden}
.shift-persons{display:flex;gap:1px;flex-wrap:nowrap;overflow:hidden}
.person-chip{font-size:.52rem;font-weight:700;line-height:1.3}

/* ── MODAL OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:520px;
  padding:16px 14px 28px;transform:translateY(100%);transition:transform .25s ease;
  max-height:88dvh;overflow-y:auto}
.overlay.show .sheet{transform:translateY(0)}
.sheet-title{font-size:1rem;font-weight:700;text-align:center;margin-bottom:14px;color:var(--text)}
.sheet-title span{color:var(--muted);font-weight:400;font-size:.85rem}

/* Day entry grid */
.entry-grid{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:4px;margin-bottom:14px}
.entry-col-header{text-align:center;font-size:.72rem;font-weight:700;padding:4px 2px;
  border-radius:6px;margin-bottom:0}
.entry-col-si{color:var(--si)}
.entry-col-ma{color:var(--ma)}
.entry-col-sa{color:var(--sa)}
.entry-row-label{display:flex;align-items:center;font-size:.75rem;color:var(--muted);
  padding:2px 0;font-weight:600}
.entry-btn{padding:6px 4px;border-radius:8px;border:2px solid transparent;
  background:rgba(255,255,255,0.04);text-align:center;font-size:.7rem;font-weight:700;
  cursor:pointer;transition:all .15s;color:var(--muted)}
.entry-btn.sel-si{border-color:var(--si);background:rgba(59,130,246,0.18);color:var(--si)}
.entry-btn.sel-ma{border-color:var(--ma);background:rgba(249,115,22,0.18);color:var(--ma)}
.entry-btn.sel-sa{border-color:var(--sa);background:rgba(34,197,94,0.18);color:var(--sa)}
.entry-btn:active{opacity:.7}

.sheet-btns{display:flex;gap:8px;margin-top:8px}
.btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:.88rem;font-weight:600;cursor:pointer}
.btn-save{flex:2;padding:11px;border-radius:10px;border:none;
  background:var(--si);color:#fff;font-size:.88rem;font-weight:700;cursor:pointer}
.btn-save:active{opacity:.85}
.btn-clear{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:#ef4444;font-size:.88rem;font-weight:600;cursor:pointer}

/* ── SETTINGS MODAL ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:all}
.modal-box{background:var(--surface);border-radius:16px;width:100%;max-width:400px;
  padding:20px 16px 16px;border:1px solid var(--border)}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--text)}
.setting-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.setting-lbl{font-size:.82rem;font-weight:600;color:var(--text);width:52px;flex-shrink:0}
.setting-time{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border);
  border-radius:8px;color:var(--text);padding:7px 10px;font-size:.82rem;font-family:inherit;outline:none}
.setting-sep{font-size:.8rem;color:var(--muted)}
.setting-pause-row{display:flex;align-items:center;gap:8px;margin-top:4px;margin-bottom:12px}
.setting-pause-lbl{font-size:.75rem;color:var(--muted);width:52px}
.pause-input{width:72px;background:rgba(255,255,255,0.06);border:1px solid var(--border);
  border-radius:8px;color:var(--text);padding:7px 10px;font-size:.82rem;font-family:inherit;outline:none}
.modal-btns{display:flex;gap:8px;margin-top:12px}

/* ── PRINT PREVIEW MODAL ── */
.print-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;
  overflow-y:auto;padding:16px;display:none}
.print-modal.show{display:block}
.print-preview{background:#fff;color:#000;margin:0 auto;max-width:900px;
  padding:12px 10px 16px;border-radius:8px;font-family:Arial,sans-serif}
.print-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.print-actions button{padding:8px 18px;border-radius:8px;font-size:.82rem;font-weight:600;
  cursor:pointer;border:none}
.btn-print-go{background:#2563eb;color:#fff}
.btn-print-close{background:#e5e7eb;color:#374151}

/* Print table */
.plan-table{width:100%;border-collapse:collapse;font-size:.62rem}
.plan-table th,.plan-table td{border:1px solid #aaa;padding:2px 3px;text-align:center;vertical-align:middle}
.plan-table th{background:#e5e7eb;font-weight:700}
.plan-table .day-col{width:14px;font-weight:700}
.plan-table .wd-col{width:32px}
.plan-table .sun-row{background:#fef08a}
.plan-table .total-row td{font-weight:700;background:#f3f4f6}
.plan-table .person-header{background:#dbeafe;color:#1e40af;font-weight:700}
.plan-table .person-header.ma{background:#ffedd5;color:#9a3412}
.plan-table .person-header.sa{background:#dcfce7;color:#14532d}
.plan-table .sub-header th{font-size:.55rem;background:#f8fafc}

@media print{
  .print-actions{display:none}
  .print-modal{position:static;background:none;padding:0}
  .print-preview{border-radius:0;padding:4mm}
  @page{size:A4 landscape;margin:6mm}
}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">◀ Vorheriger</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="nav-btn" onclick="changeMonth(1)">Nächster ▶</button>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="Drucken" onclick="openPrint()">🖨️</button>
      <button class="icon-btn" title="Einstellungen" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="cal-wrap">
    <div class="cal-header">
      <span>Mo</span><span>Di</span><span>Mi</span>
      <span>Do</span><span>Fr</span><span>Sa</span><span class="sun">So</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<!-- DAY ENTRY SHEET -->
<div class="overlay" id="dayOverlay" onclick="overlayBgClick(event)">
  <div class="sheet">
    <div class="sheet-title" id="dayTitle">Tag</div>
    <div class="entry-grid" id="entryGrid"></div>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeDay()">Abbrechen</button>
      <button class="btn-clear" onclick="clearDay()">Löschen</button>
      <button class="btn-save" onclick="saveDay()">Speichern</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal" onclick="settingsModalBg(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">⚙️ Einstellungen — Schichtzeiten</div>
    <div id="shiftSettings"></div>
    <div class="modal-btns">
      <button class="btn-cancel" style="flex:1" onclick="closeSettings()">Abbrechen</button>
      <button class="btn-save" style="flex:2" onclick="saveSettings()">Speichern</button>
    </div>
  </div>
</div>

<!-- PRINT PREVIEW -->
<div class="print-modal" id="printModal">
  <div class="print-actions">
    <button class="btn-print-close" onclick="closePrint()">✕ Schließen</button>
    <button class="btn-print-go" onclick="window.print()">🖨️ Drucken</button>
  </div>
  <div class="print-preview" id="printPreview"></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const PERSONS = ['Silke','Martina','Sandra'];
const COLORS  = {Silke:'#3b82f6', Martina:'#f97316', Sandra:'#22c55e'};
const INITIALS= {Silke:'Si', Martina:'Ma', Sandra:'Sa'};
const SHIFTS  = ['Urlaub','frei','Früh','Mittel','Spät'];
const SHIFT_SHORT = {Urlaub:'U',frei:'Fr',Früh:'F',Mittel:'M',Spät:'Sp'};
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni',
                'Juli','August','September','Oktober','November','Dezember'];

// ── State ──────────────────────────────────────────────────────────────────
let curYear, curMonth;
let data = {}; // data[y][m][d] = {Silke:shift|null, Martina:..., Sandra:...}
let settings = {
  shifts: {
    Früh:   {start:'09:45', end:'15:15', pause:0.5},
    Mittel: {start:'09:45', end:'16:00', pause:0.5},
    Spät:   {start:'13:00', end:'18:15', pause:0.5},
  }
};
let editDay = null;
let editSelections = {};

// ── Storage ────────────────────────────────────────────────────────────────
function loadStorage(){
  try{ data = JSON.parse(localStorage.getItem('schicht_data')||'{}'); }catch(e){data={};}
  try{ const s=JSON.parse(localStorage.getItem('schicht_settings')); if(s)settings=s; }catch(e){}
}
function saveStorage(){
  localStorage.setItem('schicht_data', JSON.stringify(data));
  localStorage.setItem('schicht_settings', JSON.stringify(settings));
}

// ── Calendar render ────────────────────────────────────────────────────────
function renderCalendar(){
  document.getElementById('monthTitle').textContent = MONTHS[curMonth]+' '+curYear;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const today = new Date();

  // First weekday of month (0=Sun→6), convert to Mon-based (0=Mon→6)
  const first = new Date(curYear, curMonth, 1).getDay(); // 0=Sun
  const startOffset = (first + 6) % 7; // Mon-based offset
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();

  // empty cells before
  for(let i=0;i<startOffset;i++){
    const el=document.createElement('div');
    el.className='day-cell empty';
    grid.appendChild(el);
  }

  for(let d=1;d<=daysInMonth;d++){
    const date = new Date(curYear, curMonth, d);
    const wd = date.getDay(); // 0=Sun,6=Sat
    const isSun = wd===0, isSat = wd===6;
    const isToday = today.getFullYear()===curYear&&today.getMonth()===curMonth&&today.getDate()===d;
    const dayData = (data[curYear]||{})[curMonth]||{};
    const entry = dayData[d]||{};

    const cell = document.createElement('div');
    cell.className='day-cell'+(isSun?' sun':isSat?' sat':'')+(isToday?' today':'');
    cell.onclick = ()=>openDay(d);

    // day number
    const num = document.createElement('div');
    num.className='day-num';
    num.textContent = d;
    cell.appendChild(num);

    // shift rows
    const rows = document.createElement('div');
    rows.className='shift-rows';
    SHIFTS.forEach(shift=>{
      const persons = PERSONS.filter(p=>entry[p]===shift);
      if(!persons.length) return;
      const row = document.createElement('div');
      row.className='shift-row';
      const lbl = document.createElement('span');
      lbl.className='shift-lbl';
      lbl.textContent = SHIFT_SHORT[shift];
      row.appendChild(lbl);
      const chips = document.createElement('span');
      chips.className='shift-persons';
      persons.forEach(p=>{
        const chip = document.createElement('span');
        chip.className='person-chip';
        chip.style.color=COLORS[p];
        chip.textContent=INITIALS[p];
        chips.appendChild(chip);
      });
      row.appendChild(chips);
      rows.appendChild(row);
    });
    cell.appendChild(rows);
    grid.appendChild(cell);
  }
}

function changeMonth(delta){
  curMonth += delta;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderCalendar();
}

// ── Day entry dialog ───────────────────────────────────────────────────────
function openDay(d){
  editDay = d;
  const date = new Date(curYear, curMonth, d);
  const wd = WD_LONG[date.getDay()];
  document.getElementById('dayTitle').innerHTML =
    `${d}. ${MONTHS[curMonth]} ${curYear} <span>${wd}</span>`;

  const dayData = (data[curYear]||{})[curMonth]||{};
  const entry = dayData[d]||{};
  editSelections = {
    Silke:   entry.Silke   || null,
    Martina: entry.Martina || null,
    Sandra:  entry.Sandra  || null,
  };

  renderEntryGrid();
  document.getElementById('dayOverlay').classList.add('show');
}

function renderEntryGrid(){
  const grid = document.getElementById('entryGrid');
  grid.innerHTML='';

  // header row
  const blank = document.createElement('div'); blank.className='entry-row-label'; grid.appendChild(blank);
  ['Silke','Martina','Sandra'].forEach(p=>{
    const h=document.createElement('div');
    h.className='entry-col-header entry-col-'+p.slice(0,2).toLowerCase();
    h.style.color=COLORS[p];
    h.textContent=p;
    grid.appendChild(h);
  });

  // shift rows
  SHIFTS.forEach(shift=>{
    const lbl=document.createElement('div');
    lbl.className='entry-row-label';
    lbl.textContent=shift;
    grid.appendChild(lbl);
    PERSONS.forEach(p=>{
      const btn=document.createElement('div');
      btn.className='entry-btn';
      btn.textContent=INITIALS[p];
      const sel=editSelections[p]===shift;
      if(sel) btn.classList.add('sel-'+p.slice(0,2).toLowerCase());
      btn.onclick=()=>toggleEntry(p,shift);
      grid.appendChild(btn);
    });
  });
}

function toggleEntry(person, shift){
  editSelections[person] = editSelections[person]===shift ? null : shift;
  renderEntryGrid();
}

function saveDay(){
  if(!data[curYear])data[curYear]={};
  if(!data[curYear][curMonth])data[curYear][curMonth]={};
  data[curYear][curMonth][editDay] = {...editSelections};
  saveStorage();
  closeDay();
  renderCalendar();
}

function clearDay(){
  editSelections={Silke:null,Martina:null,Sandra:null};
  renderEntryGrid();
}

function closeDay(){
  document.getElementById('dayOverlay').classList.remove('show');
}
function overlayBgClick(e){
  if(e.target===document.getElementById('dayOverlay'))closeDay();
}

// ── Settings ───────────────────────────────────────────────────────────────
function openSettings(){
  const cont = document.getElementById('shiftSettings');
  cont.innerHTML='';
  ['Früh','Mittel','Spät'].forEach(shift=>{
    const s=settings.shifts[shift];
    const row=document.createElement('div');
    row.className='setting-row';
    row.innerHTML=`
      <span class="setting-lbl">${shift}</span>
      <input class="setting-time" type="time" id="st_${shift}_start" value="${s.start}">
      <span class="setting-sep">–</span>
      <input class="setting-time" type="time" id="st_${shift}_end" value="${s.end}">
    `;
    const pauseRow=document.createElement('div');
    pauseRow.className='setting-pause-row';
    pauseRow.innerHTML=`
      <span class="setting-pause-lbl">Pause (h)</span>
      <input class="pause-input" type="number" step="0.25" min="0" max="2" id="st_${shift}_pause" value="${s.pause}">
    `;
    cont.appendChild(row);
    cont.appendChild(pauseRow);
  });
  document.getElementById('settingsModal').classList.add('show');
}

function saveSettings(){
  ['Früh','Mittel','Spät'].forEach(shift=>{
    settings.shifts[shift]={
      start: document.getElementById('st_'+shift+'_start').value,
      end:   document.getElementById('st_'+shift+'_end').value,
      pause: parseFloat(document.getElementById('st_'+shift+'_pause').value)||0.5,
    };
  });
  saveStorage();
  closeSettings();
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('show');}
function settingsModalBg(e){if(e.target===document.getElementById('settingsModal'))closeSettings();}

// ── Hours calculation ──────────────────────────────────────────────────────
function calcHours(shift){
  const s=settings.shifts[shift];
  if(!s)return 0;
  const [sh,sm]=s.start.split(':').map(Number);
  const [eh,em]=s.end.split(':').map(Number);
  const total=(eh*60+em-sh*60-sm)/60;
  return Math.round((total-s.pause)*100)/100;
}
function shiftTimeStr(shift){
  const s=settings.shifts[shift];
  if(!s)return '';
  return s.start+' - '+s.end;
}

// ── Print preview ──────────────────────────────────────────────────────────
function openPrint(){
  buildPrintPreview();
  document.getElementById('printModal').classList.add('show');
}
function closePrint(){document.getElementById('printModal').classList.remove('show');}

function buildPrintPreview(){
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const monthData = (data[curYear]||{})[curMonth]||{};

  // compute totals
  const totals = {Silke:{work:0,urlaub:0}, Martina:{work:0,urlaub:0}, Sandra:{work:0,urlaub:0}};
  for(let d=1;d<=daysInMonth;d++){
    const e=monthData[d]||{};
    PERSONS.forEach(p=>{
      const v=e[p];
      if(v==='Urlaub') totals[p].urlaub++;
      else if(v&&settings.shifts[v]) totals[p].work+=calcHours(v);
    });
  }
  PERSONS.forEach(p=>{totals[p].work=Math.round(totals[p].work*100)/100;});

  let html=`
<table class="plan-table">
<thead>
<tr>
  <th class="day-col" rowspan="2">#</th>
  <th class="wd-col" rowspan="2">Tag</th>
  <th colspan="3" class="person-header">Silke</th>
  <th colspan="3" class="person-header ma">Martina</th>
  <th colspan="3" class="person-header sa">Sandra</th>
  <th rowspan="2">Sonstiges</th>
</tr>
<tr class="sub-header">
  <th>Arbeitszeit</th><th>Pause</th><th>Std</th>
  <th>Arbeitszeit</th><th>Pause</th><th>Std</th>
  <th>Arbeitszeit</th><th>Pause</th><th>Std</th>
</tr>
</thead>
<tbody>`;

  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(curYear,curMonth,d);
    const wd=date.getDay();
    const isSun=wd===0, isSat=wd===6;
    const cls=isSun?'sun-row':isSat?'sat-row':'';
    const e=monthData[d]||{};
    html+=`<tr class="${cls}"><td class="day-col">${String(d).padStart(2,'0')}</td><td>${WD[wd]}</td>`;
    PERSONS.forEach(p=>{
      const v=e[p];
      if(!v){html+=`<td></td><td></td><td></td>`;}
      else if(v==='Urlaub'){html+=`<td>U</td><td></td><td></td>`;}
      else if(v==='frei'){html+=`<td>frei</td><td></td><td></td>`;}
      else{
        const s=settings.shifts[v];
        const h=calcHours(v);
        html+=`<td>${shiftTimeStr(v)}</td><td>${s.pause.toString().replace('.',',')}</td><td>${h.toString().replace('.',',')}</td>`;
      }
    });
    html+=`<td></td></tr>`;
  }

  html+=`</tbody><tfoot>`;
  html+=`<tr class="total-row"><td colspan="2">Arbeitsstunden</td>`;
  PERSONS.forEach(p=>html+=`<td colspan="3">${totals[p].work.toString().replace('.',',')}</td>`);
  html+=`<td></td></tr>`;
  html+=`<tr class="total-row"><td colspan="2">Urlaubstage</td>`;
  PERSONS.forEach(p=>html+=`<td colspan="3">${totals[p].urlaub}</td>`);
  html+=`<td></td></tr>`;
  html+=`</tfoot></table>`;

  document.getElementById('printPreview').innerHTML=`
    <div style="text-align:center;font-size:.85rem;font-weight:700;margin-bottom:8px;font-family:Arial">
      Schichtplan ${MONTHS[curMonth]} ${curYear}
    </div>${html}`;
}

// ── Init ───────────────────────────────────────────────────────────────────
loadStorage();
const now = new Date();
curYear  = now.getFullYear();
curMonth = now.getMonth();
renderCalendar();
</script>
</body>
</html>
